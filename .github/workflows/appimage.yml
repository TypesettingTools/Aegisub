name: Build AppImage

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  build-appimage:
    name: Build AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    env:
      # Let Meson pick up ccache wrappers
      CC: ccache gcc
      CXX: ccache g++
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements.txt', 'tools/create_appimage.sh') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('meson.build', 'meson_options.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Cache meson wraps and cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/meson
          key: ${{ runner.os }}-meson-wrap-${{ hashFiles('subprojects/**', 'meson_options.txt') }}
          restore-keys: |
            ${{ runner.os }}-meson-wrap-

      - name: Cache build directory
        uses: actions/cache@v5
        with:
          path: build
          key: ${{ runner.os }}-build-${{ hashFiles('meson.build', 'meson_options.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install apt packages (non-interactive)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake gcc g++ ninja-build curl git ca-certificates \
            libgtk-3-dev libgl1-mesa-dev libpulse-dev libasound2-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libxdamage-dev libgbm-dev libatk1.0-dev libgdk-pixbuf2.0-dev libfreetype6-dev libfontconfig1-dev libsqlite3-dev libssl-dev ccache imagemagick librsvg2-bin
          sudo apt-get clean

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache -s || true

      - name: Install Meson (pip)
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install Meson via pip
        run: python -m pip install --upgrade meson

      - name: Make AppImage script executable
        run: chmod +x tools/create_appimage.sh

      - name: Build AppImage
        run: |
          ./tools/create_appimage.sh build
        env:
          APPIMAGE_ARCH: ${{ matrix.arch }}

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v6
        with:
          name: aegisub-appimage-${{ matrix.arch }}
          path: Aegisub-v3.5.0-${{ matrix.arch }}.AppImage
