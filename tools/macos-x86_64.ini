# Build Intel binaries with native Apple Silicon tools; run tests via Rosetta.
[binaries]
c = ['/usr/bin/clang', '-arch', 'x86_64']
cpp = ['/usr/bin/clang++', '-arch', 'x86_64']
objc = ['/usr/bin/clang', '-arch', 'x86_64']
objcpp = ['/usr/bin/clang++', '-arch', 'x86_64']
ar = '/usr/bin/ar'
strip = '/usr/bin/strip'
pkg-config = 'pkg-config'
cmake = 'cmake'
exe_wrapper = ['/usr/bin/arch', '-x86_64']

[host_machine]
system = 'darwin'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true
# Never discover Apple Silicon Homebrew libraries as target dependencies.
pkg_config_libdir = ['/usr/lib/pkgconfig']

[built-in options]
pkg_config_path = []

[cmake]
CMAKE_OSX_ARCHITECTURES = 'x86_64'
CMAKE_IGNORE_PREFIX_PATH = ['/opt/homebrew', '/usr/local']
