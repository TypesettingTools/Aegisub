# Build Intel binaries with native Apple Silicon tools; run tests via Rosetta.
# Combine with macos-release.ini for target dependency search paths.
[constants]
# Overridden by tools/sccache.ini when layered after this file
compiler_cache = []

[binaries]
c = compiler_cache + ['/usr/bin/clang', '-arch', 'x86_64']
cpp = compiler_cache + ['/usr/bin/clang++', '-arch', 'x86_64']
objc = compiler_cache + ['/usr/bin/clang', '-arch', 'x86_64']
objcpp = compiler_cache + ['/usr/bin/clang++', '-arch', 'x86_64']
ar = '/usr/bin/ar'
strip = '/usr/bin/strip'
pkg-config = 'pkg-config'
cmake = 'cmake'
exe_wrapper = ['/usr/bin/arch', '-x86_64']

[host_machine]
system = 'darwin'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true

[cmake]
CMAKE_OSX_ARCHITECTURES = 'x86_64'
